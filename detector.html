<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check a job post - FakeJob Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container my-4">
  <h2>Is this job real?</h2>
  <p class="text-muted">Paste a job offer you received (email, WhatsApp, website) and get an instant risk score. Nothing is stored.</p>
  <div id="alert"></div>
  <div class="row g-4">
    <div class="col-lg-7">
      <form id="form" class="card shadow-sm card-body">
        <div class="row g-2">
          <div class="col-md-6"><label class="form-label">Job title</label><input id="title" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Company name</label><input id="company" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Contact email</label><input id="email" class="form-control" placeholder="hr@company.com"></div>
          <div class="col-md-6"><label class="form-label">Monthly salary (₹)</label><input id="salary" type="number" min="0" class="form-control"></div>
          <div class="col-12"><label class="form-label">Job description / message *</label>
            <textarea id="desc" class="form-control" rows="8" required placeholder="Paste the full job text here"></textarea></div>
        </div>
        <button class="btn btn-primary mt-3">Analyze</button>
      </form>
    </div>
    <div class="col-lg-5"><div class="card shadow-sm"><div class="card-body" id="result">
      <p class="text-muted text-center my-5">The result will appear here.</p></div></div></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const salary = document.getElementById("salary").value;
  try {
    const r = await api("/detect", { method: "POST", body: {
      title: title.value, companyName: company.value, contactEmail: email.value,
      description: desc.value, salaryMin: salary ? Number(salary) : null, salaryMax: salary ? Number(salary) : null } });
    showAlert("alert", "");
    document.getElementById("result").innerHTML = analysisHtml(r.level, r.score, r.verdict, r.reasons);
  } catch (err) { showAlert("alert", err.message); }
});
</script>
</body>
</html>
