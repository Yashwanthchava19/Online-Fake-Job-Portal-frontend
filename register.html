<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - FakeJob Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container my-5" style="max-width:480px">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Create account</h3>
    <div id="alert"></div>
    <form id="form">
      <div class="mb-3"><label class="form-label">I am a</label>
        <select id="role" class="form-select"><option value="JOB_SEEKER">Job seeker</option><option value="RECRUITER">Recruiter</option></select></div>
      <div class="mb-3"><label class="form-label">Full name</label><input id="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Phone</label><input id="phone" class="form-control"></div>
      <div class="mb-3 d-none" id="companyBox"><label class="form-label">Company name</label><input id="company" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Password (min 6 characters)</label><input id="password" type="password" minlength="6" class="form-control" required></div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Already registered? <a href="login.html">Login</a></p>
  </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();
role.addEventListener("change", () => companyBox.classList.toggle("d-none", role.value !== "RECRUITER"));
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    await api("/auth/register", { method: "POST", body: {
      name: document.getElementById("name").value, email: email.value, password: password.value,
      role: role.value, phone: phone.value, companyName: company.value } });
    location.href = "login.html";
  } catch (err) { showAlert("alert", err.message); }
});
</script>
</body>
</html>
