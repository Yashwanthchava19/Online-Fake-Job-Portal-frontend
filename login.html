<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - FakeJob Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container my-5" style="max-width:440px">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Login</h3>
    <div id="alert"></div>
    <form id="form">
      <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 text-center">New here? <a href="register.html">Create an account</a></p>
    <hr>
    <small class="text-muted">Demo: admin@jobportal.com / Admin@123<br>recruiter@brightpath.in / Recruiter@123<br>seeker@example.com / Seeker@123</small>
  </div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const em = email.value.trim(), pw = password.value;
  try {
    const token = btoa(unescape(encodeURIComponent(em + ":" + pw)));
    const user = await api("/auth/me", { token });
    Session.set(user, em, pw);
    location.href = { JOB_SEEKER: "seeker.html", RECRUITER: "recruiter.html", ADMIN: "admin.html" }[user.role];
  } catch (err) { showAlert("alert", err.message); }
});
</script>
</body>
</html>
