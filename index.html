<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FakeJob Detector - Find safe jobs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<header class="hero text-center text-white">
  <div class="container">
    <h1>Find real jobs. Avoid fake ones.</h1>
    <p class="lead mb-4">Every job posted here is automatically scanned for scam signals before you see it.</p>
    <form id="searchForm" class="row g-2 justify-content-center">
      <div class="col-md-4"><input id="q" class="form-control form-control-lg" placeholder="Job title or company"></div>
      <div class="col-md-3"><input id="loc" class="form-control form-control-lg" placeholder="Location"></div>
      <div class="col-md-2 d-grid"><button class="btn btn-warning btn-lg">Search</button></div>
    </form>
  </div>
</header>
<main class="container my-4">
  <div id="alert"></div>
  <div id="jobs" class="row g-3"></div>
</main>
<footer class="footer text-center">Fake Job Detector &copy; 2026 &middot; Never pay money to get a job.</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();
async function load() {
  const q = encodeURIComponent(document.getElementById("q").value);
  const loc = encodeURIComponent(document.getElementById("loc").value);
  try {
    const jobs = await api(`/jobs?q=${q}&location=${loc}`);
    document.getElementById("jobs").innerHTML = jobs.length ? jobs.map(j => `
      <div class="col-md-6 col-lg-4"><div class="card job-card h-100"><div class="card-body d-flex flex-column">
        <h5 class="card-title">${esc(j.title)}</h5>
        <h6 class="text-muted">${esc(j.companyName)}</h6>
        <p class="mb-1">📍 ${esc(j.location)} &middot; ${esc(j.jobType || "Full-time")}</p>
        <p class="mb-2">💰 ${salaryText(j)}</p>
        <div class="mb-3">${riskBadge(j.riskLevel, j.fraudScore)}</div>
        <a href="job.html?id=${j.id}" class="btn btn-primary mt-auto">View details</a>
      </div></div></div>`).join("")
      : `<div class="col-12 text-center text-muted py-5">No jobs found.</div>`;
  } catch (e) { showAlert("alert", e.message); }
}
document.getElementById("searchForm").addEventListener("submit", e => { e.preventDefault(); load(); });
load();
</script>
</body>
</html>
