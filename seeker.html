<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My dashboard - FakeJob Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container my-4">
  <div id="alert"></div>
  <div class="row g-4">
    <div class="col-lg-4">
      <form id="profileForm" class="card shadow-sm card-body">
        <h5>My profile</h5>
        <label class="form-label">Name</label><input id="pName" class="form-control mb-2" required>
        <label class="form-label">Phone</label><input id="pPhone" class="form-control mb-2">
        <label class="form-label">Skills</label><input id="pSkills" class="form-control mb-2" placeholder="Java, SQL, React">
        <label class="form-label">About me</label><textarea id="pAbout" class="form-control mb-3" rows="4"></textarea>
        <button class="btn btn-primary">Save profile</button>
      </form>
    </div>
    <div class="col-lg-8">
      <div class="card shadow-sm"><div class="card-body">
        <h5>My applications</h5>
        <div class="table-responsive"><table class="table align-middle">
          <thead><tr><th>Job</th><th>Company</th><th>Applied</th><th>Status</th></tr></thead>
          <tbody id="apps"></tbody></table></div>
        <a href="index.html" class="btn btn-outline-primary btn-sm">Browse more jobs</a>
      </div></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
const me = requireRole("JOB_SEEKER");
renderNav();
function fill(u) {
  pName.value = u.name || ""; pPhone.value = u.phone || ""; pSkills.value = u.skills || ""; pAbout.value = u.about || "";
}
async function init() {
  try {
    fill(await api("/auth/me"));
    const apps = await api("/seeker/applications");
    document.getElementById("apps").innerHTML = apps.length ? apps.map(a => `
      <tr><td><a href="job.html?id=${a.jobId}">${esc(a.jobTitle)}</a></td><td>${esc(a.companyName)}</td>
      <td>${new Date(a.appliedAt).toLocaleDateString()}</td><td>${statusBadge(a.status)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="text-center text-muted">You have not applied to any job yet.</td></tr>`;
  } catch (e) { showAlert("alert", e.message); }
}
document.getElementById("profileForm").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    const u = await api("/auth/profile", { method: "PUT", body: {
      name: pName.value, phone: pPhone.value, skills: pSkills.value, about: pAbout.value } });
    const s = Session.get(); s.user = u; localStorage.setItem("fjd_session", JSON.stringify(s));
    renderNav(); showAlert("alert", "Profile saved.", "success");
  } catch (err) { showAlert("alert", err.message); }
});
if (me) init();
</script>
</body>
</html>
