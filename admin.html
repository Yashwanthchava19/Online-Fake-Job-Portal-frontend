<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - FakeJob Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container my-4">
  <div id="alert"></div>
  <div class="row g-3 mb-4" id="stats"></div>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabJobs">Job moderation</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabUsers">Users</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabReports">Fake-job reports</button></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="tabJobs">
      <div class="mb-3">
        <select id="filter" class="form-select w-auto d-inline-block" onchange="loadJobs()">
          <option value="PENDING_REVIEW">Pending review</option><option value="APPROVED">Approved</option>
          <option value="REJECTED">Rejected (blocked)</option><option value="">All</option></select>
      </div>
      <div id="jobs"></div>
    </div>
    <div class="tab-pane fade" id="tabUsers"><div class="table-responsive"><table class="table align-middle bg-white">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div>
    <div class="tab-pane fade" id="tabReports"><div class="table-responsive"><table class="table bg-white">
      <thead><tr><th>Job</th><th>Reported by</th><th>Reason</th><th>Date</th></tr></thead><tbody id="reports"></tbody></table></div></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
const me = requireRole("ADMIN");
renderNav();
const fail = e => showAlert("alert", e.message);

async function loadStats() {
  const s = await api("/admin/stats");
  const cards = [["Users", s.users, "primary"], ["Jobs", s.jobs, "secondary"], ["Approved", s.approved, "success"],
                 ["Pending", s.pending, "warning"], ["Blocked", s.rejected, "danger"], ["Reports", s.reports, "dark"]];
  document.getElementById("stats").innerHTML = cards.map(c => `
    <div class="col-6 col-md-2"><div class="card text-center shadow-sm"><div class="card-body py-3">
      <div class="fs-3 fw-bold text-${c[2]}">${c[1]}</div><div class="small text-muted">${c[0]}</div></div></div></div>`).join("");
}
async function loadJobs() {
  const st = document.getElementById("filter").value;
  const jobs = await api("/admin/jobs" + (st ? "?status=" + st : ""));
  document.getElementById("jobs").innerHTML = jobs.length ? jobs.map(j => `
    <div class="card shadow-sm mb-3"><div class="card-body">
      <div class="d-flex justify-content-between flex-wrap">
        <div><h5 class="mb-0">${esc(j.title)}</h5>
          <div class="text-muted">${esc(j.companyName)} &middot; ${esc(j.location)} &middot; ${salaryText(j)}</div>
          <div class="small">Posted by ${esc(j.recruiterName)} &middot; ${esc(j.contactEmail)} &middot; ${j.reportCount} report(s)</div></div>
        <div class="text-end">${statusBadge(j.status)}<div class="mt-1">${riskBadge(j.riskLevel, j.fraudScore)}</div></div>
      </div>
      <details class="mt-2"><summary>Description &amp; detection reasons</summary>
        <pre class="desc border rounded p-2 mt-2 bg-light">${esc(j.description)}</pre>
        ${j.reasons.length ? `<ul class="mt-2 mb-0">${j.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : `<p class="text-success mt-2 mb-0">No red flags detected.</p>`}
      </details>
      <div class="mt-3">
        ${j.status !== "APPROVED" ? `<button class="btn btn-sm btn-success" onclick="act(${j.id}, 'approve')">Approve</button>` : ""}
        ${j.status !== "REJECTED" ? `<button class="btn btn-sm btn-warning" onclick="act(${j.id}, 'reject')">Reject</button>` : ""}
        <button class="btn btn-sm btn-outline-danger" onclick="removeJob(${j.id})">Delete</button>
      </div></div></div>`).join("") : `<p class="text-muted text-center py-4">No jobs in this list.</p>`;
}
async function act(id, what) {
  try { await api(`/admin/jobs/${id}/${what}`, { method: "PUT" }); refresh(); } catch (e) { fail(e); }
}
async function removeJob(id) {
  if (!confirm("Permanently delete this job?")) return;
  try { await api("/admin/jobs/" + id, { method: "DELETE" }); refresh(); } catch (e) { fail(e); }
}
async function loadUsers() {
  const users = await api("/admin/users");
  document.getElementById("users").innerHTML = users.map(u => `
    <tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role.replace("_", " "))}</td>
    <td><span class="badge text-bg-${u.enabled ? "success" : "secondary"}">${u.enabled ? "Active" : "Disabled"}</span></td>
    <td>${u.role === "ADMIN" ? "" : `<button class="btn btn-sm btn-outline-secondary" onclick="toggle(${u.id})">${u.enabled ? "Disable" : "Enable"}</button>`}</td></tr>`).join("");
}
async function toggle(id) { try { await api(`/admin/users/${id}/toggle`, { method: "PUT" }); loadUsers(); } catch (e) { fail(e); } }
async function loadReports() {
  const list = await api("/admin/reports");
  document.getElementById("reports").innerHTML = list.length ? list.map(r => `
    <tr><td>${esc(r.jobTitle)}</td><td>${esc(r.reporterName)}</td><td>${esc(r.reason)}</td>
    <td>${new Date(r.createdAt).toLocaleDateString()}</td></tr>`).join("")
    : `<tr><td colspan="4" class="text-center text-muted">No reports yet.</td></tr>`;
}
async function refresh() { try { await Promise.all([loadStats(), loadJobs(), loadUsers(), loadReports()]); } catch (e) { fail(e); } }
if (me) refresh();
</script>
</body>
</html>
