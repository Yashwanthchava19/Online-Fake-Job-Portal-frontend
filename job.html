<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job details - FakeJob Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container my-4">
  <div id="alert"></div>
  <div class="row g-4" id="content"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();
const id = new URLSearchParams(location.search).get("id");
const session = Session.get();

async function load() {
  try {
    const j = await api("/jobs/" + id);
    const isSeeker = session && session.user.role === "JOB_SEEKER";
    document.getElementById("content").innerHTML = `
    <div class="col-lg-8">
      <div class="card shadow-sm mb-3"><div class="card-body">
        <h3>${esc(j.title)}</h3>
        <h5 class="text-muted">${esc(j.companyName)}</h5>
        <p>📍 ${esc(j.location)} &middot; ${esc(j.jobType || "Full-time")} &middot; 💰 ${salaryText(j)}</p>
        <hr><pre class="desc">${esc(j.description)}</pre><hr>
        <p class="mb-0">Contact: <strong>${esc(j.contactEmail)}</strong></p>
      </div></div>
      ${isSeeker ? `
      <div class="card shadow-sm mb-3"><div class="card-body">
        <h5>Apply for this job</h5>
        <textarea id="cover" class="form-control mb-2" rows="4" maxlength="2000" placeholder="Short cover letter (optional)"></textarea>
        <button class="btn btn-success" onclick="apply()">Submit application</button>
        <button class="btn btn-outline-danger ms-2" onclick="report()">🚩 Report as fake</button>
      </div></div>` : `
      <div class="alert alert-info">${session ? "Only job seeker accounts can apply." :
        `<a href="login.html">Login</a> or <a href="register.html">register</a> as a job seeker to apply.`}</div>`}
    </div>
    <div class="col-lg-4">
      <div class="card shadow-sm"><div class="card-body">
        <h5 class="text-center mb-3">Trust analysis</h5>
        ${analysisHtml(j.riskLevel, j.fraudScore, null, j.reasons)}
      </div></div>
    </div>`;
  } catch (e) { showAlert("alert", e.message); }
}
async function apply() {
  try {
    await api(`/seeker/jobs/${id}/apply`, { method: "POST", body: { coverLetter: document.getElementById("cover").value } });
    showAlert("alert", "Application submitted! Track it from your dashboard.", "success");
  } catch (e) { showAlert("alert", e.message); }
}
async function report() {
  const reason = prompt("Why do you think this job is fake?");
  if (!reason || !reason.trim()) return;
  try {
    const r = await api(`/seeker/jobs/${id}/report`, { method: "POST", body: { reason } });
    showAlert("alert", r.message, "success");
  } catch (e) { showAlert("alert", e.message); }
}
load();
</script>
</body>
</html>
